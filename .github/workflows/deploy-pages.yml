name: Deploy BillBloom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run validation and tax tests
        run: npm test
      - name: Build site for the BillBloom project URL
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_STATIC_HOSTING: 'true'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
